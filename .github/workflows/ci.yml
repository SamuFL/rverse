# CI — Build all plugin formats and run unit tests on macOS + Windows.
# Triggered on PRs targeting develop or main, and pushes to main.
# Develop pushes are handled by publish-develop.yml (which also runs tests).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Version consistency check
  # ---------------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version sync
        run: python3 scripts/sync-version.py --check

  # ---------------------------------------------------------------------------
  # macOS — Ninja, NanoVG/Metal
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        run: |
          ./download-vst3-sdk.sh
          ./download-clap-sdks.sh

      - name: Configure (Ninja)
        run: cmake --preset macos-ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build plugins
        run: cmake --build build/macos-ninja --config Debug

      - name: Build tests
        run: cmake --build build/macos-ninja --config Debug --target rvrse_tests

      - name: Verify universal build outputs
        run: scripts/verify-macos-universal.sh --build-dir build/macos-ninja

      - name: Run native tests
        run: ctest --test-dir build/macos-ninja --output-on-failure

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Run Intel tests under Rosetta
        run: arch -x86_64 build/macos-ninja/tests/rvrse_tests

      - name: Download pluginval (pinned v1.0.4)
        run: |
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o pluginval.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 --check
          unzip -q pluginval.zip

      - name: Validate native VST3
        run: pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs "build/macos-ninja/out/RVRSE.vst3"

      - name: Validate native AU
        run: |
          # AU plugins must be registered in a system location for pluginval to find them.
          # The SYMLINK deploy method may have created a symlink here already — remove it
          # and do a real copy so pluginval gets an actual bundle.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/RVRSE.component
          cp -R -L build/macos-ninja/out/RVRSE.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/RVRSE.component
          for registrar_pid in $(pgrep -x AudioComponentRegistrar || true); do
            sudo kill "${registrar_pid}" 2>/dev/null || true
          done
          sleep 2
          pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs ~/Library/Audio/Plug-Ins/Components/RVRSE.component

      - name: Validate Intel VST3 under Rosetta
        run: arch -x86_64 pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs-x86 "build/macos-ninja/out/RVRSE.vst3"

      - name: Validate Intel AU under Rosetta
        run: |
          for registrar_pid in $(pgrep -x AudioComponentRegistrar || true); do
            sudo kill "${registrar_pid}" 2>/dev/null || true
          done
          sleep 2
          arch -x86_64 pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs-x86 ~/Library/Audio/Plug-Ins/Components/RVRSE.component

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-macOS-pluginval-logs
          path: pluginval-logs*/**
          retention-days: 14

      - name: Upload artefacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-macOS
          path: |
            build/macos-ninja/out/*.vst3
            build/macos-ninja/out/*.component
            build/macos-ninja/out/*.clap
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows — Visual Studio 2022, NanoVG/GL2
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        shell: bash
        run: |
          ./download-vst3-sdk.sh
          ./download-clap-sdks.sh

      - name: Configure (VS2022)
        run: cmake --preset windows-vs2022

      - name: Build plugins
        run: cmake --build build/windows-vs2022 --config Debug

      - name: Build tests
        run: cmake --build build/windows-vs2022 --config Debug --target rvrse_tests

      - name: Run tests
        run: ctest --test-dir build/windows-vs2022 -C Debug --output-on-failure

      - name: Download pluginval (pinned v1.0.4)
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval SHA256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath .

      - name: Validate VST3 (pluginval)
        run: ./pluginval.exe --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs "build/windows-vs2022/out/RVRSE.vst3"

      - name: Build and verify Windows ZIP
        shell: pwsh
        run: |
          $match = Select-String -Path RVRSE/config.h -Pattern 'PLUG_VERSION_STR\s+"([^"]+)"'
          ./scripts/package-windows-zip.ps1 `
            -BuildDirectory build/windows-vs2022/out `
            -OutputDirectory build/windows-vs2022/dist `
            -Version $match.Matches[0].Groups[1].Value

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-Windows-pluginval-logs
          path: pluginval-logs/**
          retention-days: 14

      - name: Upload artefacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-Windows
          path: |
            build/windows-vs2022/out/*.vst3
          retention-days: 14
