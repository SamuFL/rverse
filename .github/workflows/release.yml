# Release — build production artifacts on version tags or via manual dispatch.
# Tag pushes publish a GitHub Release. Manual dispatch builds the same signed
# artifacts for smoke-testing without minting a public release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer label for the release candidate (for example 1.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # macOS — Ninja, Release
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        run: |
          ./download-vst3-sdk.sh
          ./download-clap-sdks.sh

      - name: Configure (Ninja, Release)
        run: cmake --preset macos-ninja

      - name: Build plugins
        run: cmake --build build/macos-ninja --config Release

      - name: Build and run tests
        run: |
          cmake --build build/macos-ninja --config Release --target rvrse_tests
          ctest --test-dir build/macos-ninja --output-on-failure

      - name: Verify universal build outputs
        run: scripts/verify-macos-universal.sh --build-dir build/macos-ninja

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Run Intel tests under Rosetta
        run: arch -x86_64 build/macos-ninja/tests/rvrse_tests

      - name: Download pluginval (pinned v1.0.4)
        run: |
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o pluginval.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 --check
          unzip -q pluginval.zip

      - name: Validate native VST3
        run: pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs "build/macos-ninja/out/RVRSE.vst3"

      - name: Validate native AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/RVRSE.component
          cp -R -L build/macos-ninja/out/RVRSE.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/RVRSE.component
          for registrar_pid in $(pgrep -x AudioComponentRegistrar || true); do
            sudo kill "${registrar_pid}" 2>/dev/null || true
          done
          sleep 2
          /usr/bin/auval -v aumu 5SpI SmFL
          pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs ~/Library/Audio/Plug-Ins/Components/RVRSE.component

      - name: Validate Intel VST3 under Rosetta
        run: arch -x86_64 pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs-x86 "build/macos-ninja/out/RVRSE.vst3"

      - name: Validate Intel AU under Rosetta
        run: |
          for registrar_pid in $(pgrep -x AudioComponentRegistrar || true); do
            sudo kill "${registrar_pid}" 2>/dev/null || true
          done
          sleep 2
          arch -x86_64 /usr/bin/auval -v aumu 5SpI SmFL
          arch -x86_64 pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 --skip-gui-tests --output-dir ./pluginval-logs-x86 ~/Library/Audio/Plug-Ins/Components/RVRSE.component

      - name: Import signing certificates
        env:
          MACOS_DEV_ID_APP_CERT_P12_BASE64: ${{ secrets.MACOS_DEV_ID_APP_CERT_P12_BASE64 }}
          MACOS_DEV_ID_APP_CERT_PASSWORD: ${{ secrets.MACOS_DEV_ID_APP_CERT_PASSWORD }}
          MACOS_DEV_ID_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_DEV_ID_INSTALLER_CERT_P12_BASE64 }}
          MACOS_DEV_ID_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_DEV_ID_INSTALLER_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          app_cert_path="$RUNNER_TEMP/rvrse-dev-id-app.p12"
          installer_cert_path="$RUNNER_TEMP/rvrse-dev-id-installer.p12"
          keychain_path="$RUNNER_TEMP/rvrse-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(sys.argv[1]))' "${MACOS_DEV_ID_APP_CERT_P12_BASE64}" "${app_cert_path}"
          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(sys.argv[1]))' "${MACOS_DEV_ID_INSTALLER_CERT_P12_BASE64}" "${installer_cert_path}"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain_path" $existing_keychains
          security import "$app_cert_path" -k "$keychain_path" -P "$MACOS_DEV_ID_APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$installer_cert_path" -k "$keychain_path" -P "$MACOS_DEV_ID_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/pkgbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null

          app_identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)
          installer_identity=$(security find-certificate -a -c "Developer ID Installer" -p "$keychain_path" | openssl x509 -inform pem -noout -subject -nameopt RFC2253 | sed -E 's/.*CN=([^,]+).*/\1/' | head -n 1)

          test -n "$app_identity"
          test -n "$installer_identity"

          {
            echo "MACOS_SIGNING_KEYCHAIN=$keychain_path"
            echo "MACOS_DEV_ID_APPLICATION=$app_identity"
            echo "MACOS_DEV_ID_INSTALLER=$installer_identity"
            echo "MACOS_NOTARY_APPLE_ID=$MACOS_NOTARY_APPLE_ID"
            echo "MACOS_NOTARY_APP_PASSWORD=$MACOS_NOTARY_APP_PASSWORD"
            echo "MACOS_NOTARY_TEAM_ID=$MACOS_NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build signed macOS installer
        id: macos-package
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="manual-${GITHUB_RUN_NUMBER}"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_PATH="build/macos-ninja/dist/RVRSE-${VERSION}-macOS.pkg"
          scripts/sign-and-notarize.sh \
            --build-dir build/macos-ninja \
            --output "${PACKAGE_PATH}"
          echo "package=${PACKAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify signed installer architecture
        run: |
          scripts/verify-macos-universal.sh \
            --build-dir build/macos-ninja \
            --package "${{ steps.macos-package.outputs.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-macOS
          path: build/macos-ninja/dist/RVRSE-*.pkg

      - name: Upload notarization logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-macOS-notary-logs
          path: build/macos-ninja/dist/notarytool-*.json
          if-no-files-found: ignore

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-release-macOS-pluginval-logs
          path: pluginval-logs*/**
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows — Visual Studio 2022, Release
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        shell: bash
        run: |
          ./download-vst3-sdk.sh
          ./download-clap-sdks.sh

      - name: Configure (VS2022)
        run: cmake --preset windows-vs2022

      - name: Build plugins
        run: cmake --build build/windows-vs2022 --config Release

      - name: Build and run tests
        run: |
          cmake --build build/windows-vs2022 --config Release --target rvrse_tests
          ctest --test-dir build/windows-vs2022 -C Release --output-on-failure

      - name: Resolve package version
        id: package-version
        shell: pwsh
        run: |
          $match = Select-String -Path RVRSE/config.h -Pattern 'PLUG_VERSION_STR\s+"([^"]+)"'
          $configVersion = $match.Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart([char]"v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Package version is not SemVer: $version"
          }
          $baseVersion = ($version -split '[-+]')[0]
          if ($baseVersion -ne $configVersion) {
            throw "Package version $version does not match config.h version $configVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          ./scripts/package-windows-zip.ps1 `
            -BuildDirectory build/windows-vs2022/out `
            -OutputDirectory build/windows-vs2022/dist `
            -Version "${{ steps.package-version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RVRSE-Windows
          path: build/windows-vs2022/dist/RVRSE-*-Windows.zip

  # ---------------------------------------------------------------------------
  # Publish — GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    if: github.event_name == 'push'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v6

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Try versioned section first (## [0.1.0]), then fall back to [Unreleased]
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "$GITHUB_REF_NAME" \
            --title "RVRSE ${VERSION}" \
            --notes-file release-notes.md \
            RVRSE-macOS/RVRSE-${VERSION}-macOS.pkg \
            RVRSE-Windows/RVRSE-${VERSION}-Windows.zip

          echo "✅ Published release ${GITHUB_REF_NAME}"
          echo "   https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
